<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0176d3" />
    <title>You're Offline — OP360 EduERP</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        background: linear-gradient(135deg, #0d2c63 0%, #0a1b3d 100%);
        color: #ffffff;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px 20px;
      }
      .icon {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        background: linear-gradient(135deg, #0d2c63 0%, #0a1b3d 100%);
        border: 2px solid rgba(255, 255, 255, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 28px;
        margin-bottom: 24px;
      }
      .icon span:first-child { color: #ff8a00; }
      .icon span:last-child { color: #ffffff; }
      h1 {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 8px;
      }
      p {
        font-size: 15px;
        color: rgba(255, 255, 255, 0.72);
        max-width: 340px;
        line-height: 1.5;
        margin-bottom: 28px;
      }
      button {
        appearance: none;
        border: none;
        cursor: pointer;
        background: #0176d3;
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 28px;
        border-radius: 10px;
        transition: background 0.15s ease, transform 0.1s ease;
      }
      button:hover { background: #0d8ae0; }
      button:active { transform: scale(0.97); }
      .status {
        margin-top: 18px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.5);
      }
      .status.online { color: #4ade80; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="icon"><span>1</span><span>P</span></div>
      <h1>You're offline</h1>
      <p>OP360 EduERP couldn't reach the network. Check your connection — we'll reconnect automatically.</p>
      <button id="retryBtn" type="button">Retry</button>
      <div class="status" id="statusLine">Waiting for connection…</div>
    </div>

    <script>
      var statusLine = document.getElementById('statusLine');
      var retryBtn = document.getElementById('retryBtn');

      function updateStatus() {
        if (navigator.onLine) {
          statusLine.textContent = 'Back online — reloading…';
          statusLine.classList.add('online');
          window.location.replace('/');
        } else {
          statusLine.textContent = 'Waiting for connection…';
          statusLine.classList.remove('online');
        }
      }

      retryBtn.addEventListener('click', function () {
        window.location.reload();
      });

      window.addEventListener('online', updateStatus);
      window.addEventListener('offline', updateStatus);
      updateStatus();
    </script>
  </body>
</html>
